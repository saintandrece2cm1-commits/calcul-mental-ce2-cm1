<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calcul mental CE2-CM1</title><style>body{font-family:Arial,sans-serif;background:#eaf4ff;color:#18324b;margin:0;padding:24px}main{max-width:650px;margin:auto;background:white;padding:26px;border-radius:16px;box-shadow:0 3px 15px #0001}h1{color:#14578a}label{display:block;margin:15px 0 6px;font-weight:bold}input,select,button{font-size:18px;padding:10px;border:1px solid #abc;border-radius:8px}input,select{width:100%;box-sizing:border-box}button{background:#146ba3;color:white;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}#quiz,#result{display:none}.math{font-size:32px;font-weight:bold;margin:24px 0}#timer{font-size:24px;color:#a34313}small{color:#526477}</style></head><body><main><h1>🎯 Calcul mental CE2-CM1</h1><section id="setup"><label for="student">Ton numéro d'élève</label><input id="student" inputmode="numeric" pattern="[0-9]+" placeholder="Ex. : 12" required><label for="level">Ta classe</label><select id="level"><option>CE2</option><option>CM1</option></select><label for="mode">Activité</label><select id="mode"><option value="auto">Automatismes</option><option value="reflechi">Calcul réfléchi</option></select><button id="start">Commencer</button><p><small>Ne saisis pas ton prénom ni ton nom.</small></p></section><section id="quiz"><p id="progress"></p><p id="timer" aria-live="polite"></p><div class="math" id="question"></div><label for="answer">Ta réponse</label><input id="answer" inputmode="numeric" autocomplete="off"><button id="next">Valider et continuer</button></section><section id="result" aria-live="polite"><h2>Bravo pour ton travail !</h2><p id="summary"></p><button id="again">Rejouer</button></section></main><script>const $=id=>document.getElementById(id);let questions=[],index=0,correct=0,deadline=0,tick=null,finished=false;function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function makeQuestion(level,mode){let a,b,op,result;if(mode==='auto'){op=rand(0,2);if(op===0){a=rand(1,level==='CE2'?50:100);b=rand(1,level==='CE2'?30:100);result=a+b}else if(op===1){a=rand(10,level==='CE2'?80:150);b=rand(1,a);result=a-b}else{a=rand(2,level==='CE2'?5:9);b=rand(2,10);result=a*b}}else{op=rand(0,2);if(op===0){a=rand(2,level==='CE2'?15:35)*10;b=rand(2,level==='CE2'?9:25)*10;result=a+b}else if(op===1){a=rand(5,level==='CE2'?20:50)*10;b=rand(1,a/10)*10;result=a-b}else{a=rand(2,level==='CE2'?5:12)*10;b=rand(2,level==='CE2'?5:9);result=a*b}}return{text:`${a} ${op===0?'+':op===1?'−':'×'} ${b} = ?`,result}}function show(){if(index>=20){finish();return}$('progress').textContent=`Calcul ${index+1} sur 20`;$('question').textContent=questions[index].text;$('answer').value='';$('answer').focus()}function finish(){if(finished)return;finished=true;clearInterval(tick);$('quiz').style.display='none';$('result').style.display='block';$('summary').textContent=`Tu as réussi ${correct} calcul${correct>1?'s':''} sur ${index} répondu${index>1?'s':''}. Tu peux réessayer !`;}function next(){if(finished)return;const value=$('answer').value.trim();if(value===''||!Number.isFinite(Number(value)))return;if(Date.now()>=deadline){finish();return}if(Number(value)===questions[index].result)correct++;index++;show()}$('start').onclick=()=>{if(!/^\d+$/.test($('student').value.trim())){alert('Entre ton numéro d’élève (chiffres uniquement).');return}const level=$('level').value,mode=$('mode').value;questions=Array.from({length:20},()=>makeQuestion(level,mode));index=0;correct=0;finished=false;const seconds=mode==='reflechi'?180:level==='CE2'?120:60;deadline=Date.now()+seconds*1000;$('setup').style.display='none';$('result').style.display='none';$('quiz').style.display='block';function updateTimer(){const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=`Temps restant : ${Math.floor(remaining/60)} min ${String(remaining%60).padStart(2,'0')} s`;if(remaining===0)finish()}updateTimer();tick=setInterval(updateTimer,200);show()};$('next').onclick=next;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')next()});$('again').onclick=()=>{$('result').style.display='none';$('setup').style.display='block'};</script></body></html>
